<svg xmlns="http://www.w3.org/2000/svg" width="34" height="16" viewBox="0 0 34 16" shape-rendering="crispEdges">
  <!-- Rear wing blade -->
  <rect x="1"  y="1"  width="12" height="1" fill="#666666"/>
  <rect x="2"  y="2"  width="10" height="1" fill="#ff5500"/>
  <rect x="1"  y="3"  width="12" height="1" fill="#666666"/>

  <!-- Rear wing arm -->
