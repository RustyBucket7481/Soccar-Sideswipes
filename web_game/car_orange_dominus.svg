  <rect x="1"  y="10" width="2"  height="2" fill="#0033ff"/>
  <rect x="1"  y="12" width="2"  height="1" fill="#cc3300"/>

  <!-- Wheels (pixel-art rects, drawn last) -->
  <rect x="7" y="8" width="1" height="1" fill="#333333"/>
  <rect x="5" y="9" width="5" height="1" fill="#333333"/>
  <rect x="4" y="10" width="7" height="1" fill="#333333"/>
  <rect x="4" y="11" width="7" height="1" fill="#333333"/>
