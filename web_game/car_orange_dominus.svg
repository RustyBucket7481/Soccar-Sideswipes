  <rect x="13" y="5"  width="13" height="1" fill="#ffdd66"/>
  <rect x="12" y="6"  width="15" height="1" fill="#ffdd66"/>
  <rect x="11" y="7"  width="17" height="1" fill="#ffdd66"/>
