  <rect x="33" y="5"  width="1"  height="4" fill="#666666"/>

  <!-- Front splitter -->
  <rect x="30" y="14" width="3"  height="1" fill="#cc3300"/>

  <!-- Dual strip headlights -->
  <rect x="31" y="10" width="2"  height="1" fill="#ffffff"/>
  <rect x="31" y="11" width="2"  height="1" fill="#000000"/>
  <rect x="31" y="12" width="2"  height="1" fill="#ffffff"/>
  <rect x="31" y="13" width="2"  height="1" fill="#000000"/>

