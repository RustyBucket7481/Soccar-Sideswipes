<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Soccar Sideswipes</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; }
body { display:flex; align-items:center; justify-content:center; font-family:Arial,sans-serif; }
canvas { display:block; cursor:default; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ─── setup ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 800, H = 520;
canvas.width = W; canvas.height = H;
function resizeCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ─── layout (derived from Scratch arena SVG 560.05 × 334.90) ─────────────────
const SB      = 58;                            // scoreboard height
const SVG_W   = 560.05, SVG_H = 334.90;
const A_SCALE = (H - SB) / SVG_H;             // ~1.379
const ARENA_X = (W - SVG_W * A_SCALE) / 2;    // ~14
const ARENA_Y = SB;
const WL      = Math.round(60  * A_SCALE + ARENA_X);  // left wall  ~97
const WR      = Math.round(500 * A_SCALE + ARENA_X);  // right wall ~704
const CEIL    = Math.round(7   * A_SCALE + ARENA_Y);  // ceiling    ~68
const FLOOR   = Math.round(317 * A_SCALE + ARENA_Y);  // floor      ~495
const BALL_R  = 22;

// ─── goal opening: centre 100 Scratch-units of each wall ─────────────────────────────────────
// Scratch gap: y=+50 to y=-50. canvas = FLOOR - (scratch_y+150)*A_SCALE
const GT_TOP = 160;   // original position
const GT_BOT = 298;

const CW = 32;
const CH = 17;

// ─── physics (Scratch 30fps -> 60fps with A_SCALE=1.38 px/unit) ───────────────────
let   GRAV      = 0.175;  // terminal fall = 6.9 px/frame; overridden by settings
const FRIC      = 0.9747; // sqrt(0.95): matches Scratch real-time decay
let   B_GRAV    = 0.07;
const B_BOUNCE  = 0.70;
const B_FRIC    = 0.997;
const C_BOUNCE  = 0.45;
const JUMP_F    = 7.0;    // raised for better feel (~90px peak, 21% of arena)
const BOOST_F   = 0.36;   // terminal boost = 0.36*0.9747/0.0253 = 13.9 px/frame (matches Scratch 828 px/s)
const DRIVE     = 0.36;   // terminal drive = 0.36*0.9747/0.0253 = 13.9 px/frame (matches Scratch 828 px/s)
const MAX_SPD   = 20;
const BOOST_MAX = 100;

// ─── state ────────────────────────────────────────────────────────────────────
const S = { MENU:0, PLAY:1, GOAL:2, EXPL:3, PAUSE:4, KICKOFF:5, SETTINGS:6, WIN:7 };
let state = S.SETTINGS;
let pauseSel = 0;
let kickoffTimer = 0;

// ─── settings ─────────────────────────────────────────────────────────────────
const SDEFS = [
  { label:'GRAVITY', vals:['Very Low','Low','Normal','High','Very High'], cur:2 },
  { label:'MODE',    vals:['Game','Free Play'],                           cur:0 },
  { label:'TIMER',   vals:['1 Min','2 Min','3 Min','5 Min','First to 3','First to 5','Unlimited'], cur:2 },
  { label:'DEMOS',   vals:['None','Normal','On Contact'],                 cur:0 },
];
let settingSel = 0;
const GRAVITY_VALS = [0.045, 0.10, 0.175, 0.27, 0.38];
const BGRAV_VALS   = [0.012, 0.035, 0.07, 0.11, 0.16];
const TIMER_FRAMES = [3600, 7200, 10800, 18000, -1, -1, -1];
let gameTimer = 0;  // counts down in frames; -1 = score-based or unlimited
let winner    = '';
let bScore = 0, oScore = 0;
let bCar = 0, oCar = 0;      // 0=Fennec  1=Dominus  2=Merc
let goalTimer = 0, goalTeam = '', goalKph = 0;
let goalExplosion = 0;        // set per-goal from scorer's choice
let bExplosion = 0, oExplosion = 0;  // per-player explosion choice
let goalExplX = 0, goalExplY = 0;
let frame = 0;
let shake = 0;          // screen shake magnitude (decays each frame)
let flashAlpha = 0, flashCol = '#ffffff';  // full-screen flash overlay
const particles = [];   // { x, y, vx, vy, life, maxLife, r, col }

function emitParticles(x, y, n, col, speed, size) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.4 + Math.random() * 0.6);
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - speed*0.3,
                     life: 1, maxLife: 18 + Math.random()*18, r: size*(0.5+Math.random()*0.5), col });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += (p.noGrav ? 0 : 0.15);
    if (!p.noFric) { p.vx *= 0.92; p.vy *= 0.92; }
    if (p.rGrowth) p.r += p.rGrowth;
    if (p.angle !== undefined) p.angle += p.angV || 0;
    p.life -= 1 / p.maxLife;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life * p.life;
    ctx.fillStyle = p.col;
    if (p.shape === 'rect') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle || 0);
      const sz = p.r * p.life;
      ctx.fillRect(-sz, -sz * 0.35, sz * 2, sz * 0.7);
      ctx.restore();
    } else if (p.shape === 'line') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.atan2(p.vy, p.vx));
      const lLen = (p.lineLen || p.r * 3) * p.life;
      const lHalf = (p.lineHeight || 2) * 0.5;
      ctx.fillRect(-lLen, -lHalf, lLen, p.lineHeight || 2);
      ctx.restore();
    } else if (p.shape === 'ring') {
      ctx.save();
      ctx.strokeStyle = p.col;
      ctx.lineWidth = (p.lineWidth || 2) * p.life;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ─── input ────────────────────────────────────────────────────────────────────
const keys = {};
const GAME_KEYS = new Set(['a','d','w','q','ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Escape']);
const mouse = { x:0, y:0 };
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const scaleX = W / r.width, scaleY = H / r.height;
  mouse.x = (e.clientX - r.left) * scaleX;
  mouse.y = (e.clientY - r.top)  * scaleY;
  const ph = 200, poy = H/2 - ph/2;
  const carRowY = [232, 290, 348];
  const inCarRow = carRowY.some(ry => mouse.y >= ry-22 && mouse.y <= ry+22 &&
    ((mouse.x >= W/4-120 && mouse.x <= W/4+120) || (mouse.x >= 3*W/4-120 && mouse.x <= 3*W/4+120)));
  const inCarEnter = mouse.x >= W/2-115 && mouse.x <= W/2+115 && mouse.y >= 375 && mouse.y <= 419;
  const colW = W/2 - 40, rowH = 72, startY = 108;
  const inExplRow = [0,1,2].some(i => { const ry = startY+i*rowH;
    return mouse.y >= ry && mouse.y <= ry+rowH-6 &&
      ((mouse.x >= 30 && mouse.x <= 30+colW) || (mouse.x >= W/2+10 && mouse.x <= W/2+10+colW)); });
  const inExplEnter = mouse.x >= W/2-115 && mouse.x <= W/2+115 && mouse.y >= H-70 && mouse.y <= H-26;
  const inPauseBtn = state === S.PAUSE && mouse.x >= W/2-120 && mouse.x <= W/2+120 &&
    ((mouse.y >= poy+75 && mouse.y <= poy+111) || (mouse.y >= poy+130 && mouse.y <= poy+166));
  const inSettingsEnter = state === S.SETTINGS && mouse.x >= W/2-120 && mouse.x <= W/2+120 && mouse.y >= H-78 && mouse.y <= H-34;
  const inWinEnter = state === S.WIN && mouse.x >= W/2-140 && mouse.x <= W/2+140 && mouse.y >= 340 && mouse.y <= 390;
  canvas.style.cursor = (state === S.MENU && (inCarRow || inCarEnter)) ||
    (state === S.EXPL && (inExplRow || inExplEnter)) || inPauseBtn || inSettingsEnter || inWinEnter ? 'pointer' : 'default';
});
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const scaleX = W / r.width, scaleY = H / r.height;
  const cx = (e.clientX - r.left) * scaleX;
  const cy = (e.clientY - r.top)  * scaleY;
  if (state === S.SETTINGS) {
    const rowH = 54, startY = 168;
    for (let i = 0; i < SDEFS.length; i++) {
      const y = startY + i * rowH;
      if (cy >= y - 22 && cy <= y + 24) {
        settingSel = i;
        const sd = SDEFS[i];
        if (cx >= W/2 + 20 && cx < W/2 + 100) sd.cur = (sd.cur + sd.vals.length - 1) % sd.vals.length;
        else if (cx >= W/2 + 200) sd.cur = (sd.cur + 1) % sd.vals.length;
        else if (cx > W/2 + 100) sd.cur = (sd.cur + 1) % sd.vals.length;
      }
    }
    if (cx >= W/2 - 120 && cx <= W/2 + 120 && cy >= H - 78 && cy <= H - 34) state = S.MENU;
    return;
  }
  if (state === S.WIN) {
    if (cx >= W/2 - 140 && cx <= W/2 + 140 && cy >= 340 && cy <= 390) {
      winner = ''; bScore = 0; oScore = 0; state = S.SETTINGS;
    }
    return;
  }
  if (state === S.MENU) {
    const rowY = [232, 290, 348];
    for (let i = 0; i < 3; i++) {
      if (cy >= rowY[i]-22 && cy <= rowY[i]+22) {
        if (cx >= W/4-120 && cx <= W/4+120) bCar = i;
        if (cx >= 3*W/4-120 && cx <= 3*W/4+120) oCar = i;
      }
    }
    if (cx >= W/2-115 && cx <= W/2+115 && cy >= 375 && cy <= 419) state = S.EXPL;
  } else if (state === S.EXPL) {
    const colW = W/2 - 40, rowH = 72, startY = 108;
    for (let i = 0; i < 3; i++) {
      const ry = startY + i * rowH;
      if (cy >= ry && cy <= ry + rowH - 6) {
        if (cx >= 30 && cx <= 30 + colW) bExplosion = i;
        if (cx >= W/2+10 && cx <= W/2+10+colW) oExplosion = i;
      }
    }
    if (cx >= W/2-115 && cx <= W/2+115 && cy >= H-70 && cy <= H-26) startGame();
  } else if (state === S.PAUSE) {
    const ph = 200, poy = H/2 - ph/2;
    if (cx >= W/2-120 && cx <= W/2+120) {
      if (cy >= poy+75 && cy <= poy+111) { state = S.PLAY; }
      if (cy >= poy+130 && cy <= poy+166) { winner=''; bScore=0; oScore=0; state=S.SETTINGS; particles.length=0; }
    }
  }
});
let menuFocus = 0; // 0=blue  1=orange  (arrow key focus in car/explosion menus)
document.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = true;
  if (GAME_KEYS.has(k)) e.preventDefault();
  onMenuKey(k);
});
document.addEventListener('keyup', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = false;
});

function onMenuKey(k) {
  if (state === S.SETTINGS) {
    if (k === 'ArrowUp')    settingSel = (settingSel + SDEFS.length - 1) % SDEFS.length;
    if (k === 'ArrowDown')  settingSel = (settingSel + 1) % SDEFS.length;
    if (k === 'ArrowLeft')  { const sd = SDEFS[settingSel]; sd.cur = (sd.cur + sd.vals.length - 1) % sd.vals.length; }
    if (k === 'ArrowRight') { const sd = SDEFS[settingSel]; sd.cur = (sd.cur + 1) % sd.vals.length; }
    if (k === 'Enter')      state = S.MENU;
    return;
  }
  if (state === S.WIN) {
    if (k === 'Enter') { winner = ''; bScore = 0; oScore = 0; state = S.SETTINGS; }
    return;
  }
  if (state === S.MENU) {
    if (k==='1') bCar=0; if (k==='2') bCar=1; if (k==='3') bCar=2;
    if (k==='7') oCar=0; if (k==='8') oCar=1; if (k==='9') oCar=2;
    if (k==='ArrowLeft')  menuFocus=0;
    if (k==='ArrowRight') menuFocus=1;
    if (k==='ArrowUp')   { if (menuFocus===0) bCar=(bCar+2)%3; else oCar=(oCar+2)%3; }
    if (k==='ArrowDown') { if (menuFocus===0) bCar=(bCar+1)%3; else oCar=(oCar+1)%3; }
    if (k==='Enter') state = S.EXPL;
  } else if (state === S.EXPL) {
    if (k==='1') bExplosion=0; if (k==='2') bExplosion=1; if (k==='3') bExplosion=2;
    if (k==='7') oExplosion=0; if (k==='8') oExplosion=1; if (k==='9') oExplosion=2;
    if (k==='ArrowLeft')  menuFocus=0;
    if (k==='ArrowRight') menuFocus=1;
    if (k==='ArrowUp')   { if (menuFocus===0) bExplosion=(bExplosion+2)%3; else oExplosion=(oExplosion+2)%3; }
    if (k==='ArrowDown') { if (menuFocus===0) bExplosion=(bExplosion+1)%3; else oExplosion=(oExplosion+1)%3; }
    if (k==='Escape') state = S.MENU;
    if (k==='Enter') startGame();
  } else if (state === S.GOAL && k==='Enter') {
    spawnObjects();
  } else if ((state === S.PLAY || state === S.GOAL) && k === 'Escape') {
    state = S.PAUSE; pauseSel = 0;
  } else if (state === S.PAUSE) {
    if (k === 'Escape' || (k === 'Enter' && pauseSel === 0)) { state = S.PLAY; }
    else if (k === 'Enter' && pauseSel === 1) { winner=''; bScore=0; oScore=0; state=S.SETTINGS; particles.length=0; }
    else if (k === 'ArrowUp') pauseSel = 0;
    else if (k === 'ArrowDown') pauseSel = 1;
  }
}

// ─── objects ──────────────────────────────────────────────────────────────────
let blue, orange, ball;

function makeCar(x, team) {
  const f = team === 'blue' ? 1 : -1;
  return { x, y:FLOOR, vx:0, vy:0, ground:false, jumps:0,
           boost:BOOST_MAX, facing:f, naturalFacing:f, team,
           jumpPressed:false, angle:0, angV:0, boosting:false,
           visualFlipped:false, demoTimer:0 };
}

function spawnObjects() {
  blue   = makeCar(WL + (WR-WL)*0.18, 'blue');
  orange = makeCar(WL + (WR-WL)*0.82, 'orange');
  ball   = { x:(WL+WR)/2, y:FLOOR-150, vx:0, vy:0, spin:0 };
  particles.length = 0;
  flashAlpha = 0;
  shake = 0;
  if (winner !== '') {
    state = S.WIN;
  } else {
    state  = S.KICKOFF;
    kickoffTimer = 150;
  }
}

function applySettings() {
  GRAV   = GRAVITY_VALS[SDEFS[0].cur];
  B_GRAV = BGRAV_VALS[SDEFS[0].cur];
  const tf = TIMER_FRAMES[SDEFS[2].cur];
  gameTimer = tf;
}

function startGame() {
  bScore = 0; oScore = 0; winner = '';
  applySettings();
  spawnObjects();
}

// ─── physics ──────────────────────────────────────────────────────────────────
function demoCar(c) {
  if (c.demoTimer > 0) return;
  c.demoTimer = 180;
  c.vx = c.vy = c.angV = 0;
  const col = c.team === 'blue' ? '#4488ff' : '#ff7733';
  emitParticles(c.x, c.y, 25, col, 10, 4);
  emitParticles(c.x, c.y, 15, '#ffffff', 8, 2);
  shake = Math.max(shake, 4);
}

function updateCar(c, lk, rk, jk, bk) {
  if (c.demoTimer > 0) {
    c.demoTimer--;
    if (c.demoTimer <= 0) {
      c.x = c.team === 'blue' ? WL + (WR-WL)*0.18 : WL + (WR-WL)*0.82;
      c.y = FLOOR; c.vx = 0; c.vy = 0; c.angV = 0; c.angle = 0;
      c.boost = BOOST_MAX; c.jumps = 0; c.ground = true; c.facing = c.naturalFacing;
    }
    return;
  }
  const vr = c.angle * Math.PI / 180;

  if (c.ground) {
    if (keys[lk]) { c.vx -= DRIVE; c.facing = -1; }
    if (keys[rk]) { c.vx += DRIVE; c.facing =  1; }
  } else {
    // air spin — use c.facing so spin always matches visual direction
    if (keys[lk]) c.angV -= 0.25 * c.facing;
    if (keys[rk]) c.angV += 0.25 * c.facing;
  }
  c.boosting = !!(keys[bk]) && c.boost > 0;
  if (c.boosting) {
    c.vx += c.facing * BOOST_F * Math.cos(vr);
    c.vy +=            BOOST_F * Math.sin(vr);
    c.boost = Math.max(0, c.boost - 1);
  }
  // Boost slowly refills on the ground (like collecting small pads in RL Sideswipe)
  if (c.ground && state === S.PLAY) c.boost = Math.min(BOOST_MAX, c.boost + 0.35);

  if (keys[jk]) {
    if (!c.jumpPressed && c.jumps < 2) {
      if (c.jumps === 0) {
        c.vy -= JUMP_F;                           // first jump: always straight up
      } else {
        // Second jump.
        const isFwd = (keys[rk] && c.facing === 1) || (keys[lk] && c.facing === -1);
        if (isFwd) {
          // Front flip: forward momentum keeps the car near the ball while rotating
          // so the tangential surface velocity in carBallCollide creates the flick naturally.
          c.vx += c.facing * JUMP_F * 0.75;
          c.vy -= JUMP_F * 0.5;
          c.angV += 11;
        } else {
          // Back flip / musty.
          c.vx += c.facing * JUMP_F * Math.sin(vr);
          c.vy -= JUMP_F * Math.cos(vr);
          if (keys[lk] || keys[rk]) {
            const spinDir = keys[rk] ? 1 : -1;
            c.angV += spinDir * c.facing * 4;
          }
        }
      }
      c.jumps++;
      c.ground = false;
    }
    c.jumpPressed = true;
  } else {
    c.jumpPressed = false;
  }

  // gravity + friction on both axes (Scratch applies same friction to xv AND yv AND turn)
  c.vy += GRAV;
  c.vx *= FRIC;
  c.vy *= FRIC;
  c.vx  = Math.max(-MAX_SPD, Math.min(MAX_SPD, c.vx));

  c.x += c.vx;
  c.y += c.vy;
  c.ground = false;

  if (c.y >= FLOOR)     { c.y = FLOOR;     c.vy = 0; c.ground = true; c.jumps = 0; }
  if (c.y - CH <= CEIL) { c.y = CEIL + CH; c.vy = Math.abs(c.vy) * C_BOUNCE; }
  const inGoalGap = c.y > GT_TOP + 4 && c.y - CH < GT_BOT - 4;
  if (c.x - CW/2 < WL) {
    if (inGoalGap) { if (c.x - CW/2 < CLIP_L) { c.x = CLIP_L+CW/2; c.vx =  Math.abs(c.vx)*C_BOUNCE; } }
    else { c.x = WL+CW/2; c.vx = Math.abs(c.vx)*C_BOUNCE; }
  }
  if (c.x + CW/2 > WR) {
    if (inGoalGap) { if (c.x + CW/2 > CLIP_R) { c.x = CLIP_R-CW/2; c.vx = -Math.abs(c.vx)*C_BOUNCE; } }
    else { c.x = WR-CW/2; c.vx = -Math.abs(c.vx)*C_BOUNCE; }
  }

  // Standing on the other car: treat as grounded, driving pushes the bottom car.
  if (!c.ground) {
    const other = c === blue ? orange : blue;
    if (other) {
      const onTop = c.y <= other.y - CH + 3 &&
                    c.y >= other.y - CH - 6 &&
                    Math.abs(c.x - other.x) < CW * 0.9;
      if (onTop) {
        c.y      = other.y - CH;
        c.vy     = 0;
        c.ground = true;
        c.jumps  = 0;
      }
    }
  }

  if (!c.ground) {
    c.angV *= FRIC;
    c.angle += c.angV;
  } else {
    c.angle *= 0.1;
    c.angV   = 0;
    if (Math.abs(c.angle) < 0.5) c.angle = 0;
  }

}

function updateBall() {
  ball.vy += B_GRAV;
  ball.vx *= B_FRIC;
  ball.vy *= B_FRIC;
  ball.spin += ball.vx * 0.06;
  ball.x  += ball.vx;
  ball.y  += ball.vy;

  if (ball.y + BALL_R >= FLOOR) {
    ball.y  = FLOOR - BALL_R;
    ball.vy = -Math.abs(ball.vy) * B_BOUNCE;
    ball.vx *= 0.96;   // much less ground friction — ball rolls freely
  }
  if (ball.y - BALL_R <= CEIL) {
    ball.y  = CEIL + BALL_R;
    ball.vy = Math.abs(ball.vy) * B_BOUNCE;
  }

  // left wall / goal — ball must travel all the way to the back of the net
  if (ball.x - BALL_R <= WL) {
    if (ball.y >= GT_TOP && ball.y <= GT_BOT) {
      // Inside goal opening: let ball travel freely, score at back wall
      if (ball.x - BALL_R <= CLIP_L && state === S.PLAY) score('orange');
      // Bounce off top/bottom goal bars while inside net
      if (ball.y - BALL_R < GT_TOP) { ball.y = GT_TOP + BALL_R; ball.vy =  Math.abs(ball.vy) * B_BOUNCE; }
      if (ball.y + BALL_R > GT_BOT) { ball.y = GT_BOT - BALL_R; ball.vy = -Math.abs(ball.vy) * B_BOUNCE; }
    } else {
      ball.x  = WL + BALL_R;
      ball.vx = Math.abs(ball.vx) * B_BOUNCE;
    }
  }
  // right wall / goal
  if (ball.x + BALL_R >= WR) {
    if (ball.y >= GT_TOP && ball.y <= GT_BOT) {
      if (ball.x + BALL_R >= CLIP_R && state === S.PLAY) score('blue');
      if (ball.y - BALL_R < GT_TOP) { ball.y = GT_TOP + BALL_R; ball.vy =  Math.abs(ball.vy) * B_BOUNCE; }
      if (ball.y + BALL_R > GT_BOT) { ball.y = GT_BOT - BALL_R; ball.vy = -Math.abs(ball.vy) * B_BOUNCE; }
    } else {
      ball.x  = WR - BALL_R;
      ball.vx = -Math.abs(ball.vx) * B_BOUNCE;
    }
  }
}

function score(team) {
  if (state !== S.PLAY) return;
  if (SDEFS[1].cur === 1) {
    // Free Play — no scoring
    spawnObjects(); return;
  }
  if (team === 'blue') bScore++; else oScore++;
  goalTeam  = team;
  goalKph   = Math.round(Math.hypot(ball.vx, ball.vy) * 4.5);
  goalExplX = ball.x; goalExplY = ball.y;
  goalExplosion = team === 'blue' ? bExplosion : oExplosion;

  // First-to-X win check
  const firstTo3 = SDEFS[2].cur === 4;
  const firstTo5 = SDEFS[2].cur === 5;
  if (firstTo3 && (bScore >= 3 || oScore >= 3)) winner = bScore >= 3 ? 'blue' : 'orange';
  if (firstTo5 && (bScore >= 5 || oScore >= 5)) winner = bScore >= 5 ? 'blue' : 'orange';

  state     = S.GOAL;
  goalTimer = 360;
  shake = 4;
  triggerGoalExplosion(team);
}

function spawnRing(x, y, growRate, maxL, col, lw) {
  particles.push({ x, y, vx:0, vy:0, life:1, maxLife:maxL, r:4, rGrowth:growRate, col, shape:'ring', lineWidth:lw, noGrav:true, noFric:true });
}

function spawnAirStrikeMissile(fromRight, frames) {
  const tx = goalExplX + (Math.random()-0.5)*90;
  const ty = goalExplY + (Math.random()-0.5)*35;

  particles.push({ x:sx, y:sy, vx, vy, life:1, maxLife:frames, r:24, lineHeight:11, lineLen:110, col:'rgba(210,215,220,0.28)', shape:'line', noGrav:true, noFric:true });
  particles.push({ x:sx, y:sy, vx, vy, life:1, maxLife:frames, r:18, lineHeight:7,  lineLen:85,  col:'rgba(255,248,210,0.55)', shape:'line', noGrav:true, noFric:true });
  particles.push({ x:sx, y:sy, vx, vy, life:1, maxLife:frames, r:12, lineHeight:5,  lineLen:60,  col:'#fffff0', shape:'line', noGrav:true, noFric:true });
  particles.push({ x:sx, y:sy, vx, vy, life:1, maxLife:frames, r:6,  lineHeight:3,  lineLen:38,  col:'#ffffff', shape:'line', noGrav:true, noFric:true });

function carBallCollide(c) {
  if (c.demoTimer > 0) return;
  const left = c.x - CW/2, right = c.x + CW/2;
  const top  = c.y - CH,   bot   = c.y;
  const cpx  = Math.max(left, Math.min(right, ball.x));
  const cpy  = Math.max(top,  Math.min(bot,   ball.y));
  const dx   = ball.x - cpx, dy = ball.y - cpy;
  const dist = Math.hypot(dx, dy);
  if (dist >= BALL_R) return;

  // Compute collision normal — when ball center is fully inside the box,
  // push toward the nearest face rather than always pushing upward.
  let nx, ny, pen;
  if (dist > 0) {
    nx = dx / dist; ny = dy / dist;
    pen = BALL_R - dist;
  } else {
    const dL = ball.x - left, dR = right - ball.x;
    const dT = ball.y - top,  dB = bot   - ball.y;
    const m  = Math.min(dL, dR, dT, dB);
    if      (m === dL) { nx = -1; ny =  0; pen = BALL_R + dL; }
    else if (m === dR) { nx =  1; ny =  0; pen = BALL_R + dR; }
    else if (m === dT) { nx =  0; ny = -1; pen = BALL_R + dT; }
    else               { nx =  0; ny =  1; pen = BALL_R + dB; }
  }
  ball.x += nx * pen;
  ball.y += ny * pen;

  // Surface velocity at contact point due to car rotation (enables flicks).
  const angV_rad = c.angV * Math.PI / 180;
  const rx = cpx - c.x,  ry = cpy - (c.y - CH / 2);
  const surfVx = -angV_rad * ry,  surfVy = angV_rad * rx;

  // Normal impulse — relative velocity includes car rotation.
  const dot = (ball.vx - c.vx - surfVx)*nx + (ball.vy - c.vy - surfVy)*ny;
  if (dot < 0) {
    const carSpd = Math.hypot(c.vx, c.vy);
    const isPower = !c.ground && (carSpd > 5 || Math.abs(c.angV) > 3.0);
    const isTop = ny < -0.5;
    // Top contact: co-move when car is jumping (c.vy < -1) so the ball stays
    // dribbled; bounce gently (1.20) when the ball falls onto a stationary car.
    const topFactor = c.vy < -1 ? 1.0 : 1.20;
    const imp = -dot * (isTop ? topFactor : isPower ? 1.60 : 1.25);
    ball.vx += nx * imp;  ball.vy += ny * imp;
    c.vx    -= nx * imp * 0.12;  c.vy -= ny * imp * 0.12;
    if (imp > 4) shake = Math.max(shake, 1);
    if (isPower && imp > 4) {
      emitParticles(ball.x, ball.y, 10, c.team === 'blue' ? '#88ccff' : '#ffcc66', 7, 2);
      shake = Math.max(shake, 2);
    }
  }

  // Roof friction: when ball is on top of the car, bleed horizontal velocity
  // toward the car so it feels like the ball is resting on a moving surface.
  if (ny < -0.5) {
    const relVxT = ball.vx - c.vx;
    const fImp   = relVxT * 0.22;
    ball.vx -= fImp;
    c.vx    += fImp * 0.10;
  }

  // Tangential transfer: car spin flicks the ball sideways.
  // When visualFlipped, physics rotation appears reversed to the player, so negate.
  const tx = -ny, ty = nx;
  const surfT = surfVx * tx + surfVy * ty;
  if (Math.abs(surfT) > 0.3) {
    const flickDir = c.visualFlipped ? -1 : 1;
    ball.vx += tx * surfT * flickDir * 0.75;
    ball.vy += ty * surfT * flickDir * 0.75;
  }
}

function carCarCollide() {
  if (blue.demoTimer > 0 || orange.demoTimer > 0) return;
  const al = blue.x - CW/2, ar = blue.x + CW/2, at = blue.y - CH, ab = blue.y;
  const ol = orange.x - CW/2, or2 = orange.x + CW/2, ot = orange.y - CH, ob = orange.y;
  if (ar <= ol || al >= or2 || ab <= ot || at >= ob) return;

  const overlapX = Math.min(ar - ol, or2 - al);
  const overlapY = Math.min(ab - ot, ob - at);
  const signX = blue.x >= orange.x ? 1 : -1;
  const signY = (blue.y - CH/2) >= (orange.y - CH/2) ? 1 : -1;

  // when both cars are on the ground their vertical overlap always equals CH,
  // so always resolve horizontally in that case to prevent pass-through
  const resolveH = (blue.ground && orange.ground) || overlapX <= overlapY;
  const relSpd = Math.hypot(blue.vx - orange.vx, blue.vy - orange.vy);
  if (resolveH) {
    blue.x   += signX * overlapX / 2;
    orange.x -= signX * overlapX / 2;
    const relVx = (blue.vx - orange.vx) * signX;
    if (relVx < 0) {
      const imp = -relVx * 0.9;
      blue.vx   += signX * imp;
      orange.vx -= signX * imp;
    }
  } else {
    blue.y   += signY * overlapY / 2;
    orange.y -= signY * overlapY / 2;
    const relVy = (blue.vy - orange.vy) * signY;
    if (relVy < 0) {
      const imp = -relVy * 0.9;
      blue.vy   += signY * imp;
      orange.vy -= signY * imp;
    }
  }

  // Demo check
  if (SDEFS[3].cur === 2) {
    // On Contact: demo the slower / less boosting car
    const hitCar = Math.abs(blue.vx) + Math.abs(blue.vy) < Math.abs(orange.vx) + Math.abs(orange.vy) ? blue : orange;
    demoCar(hitCar);
  } else if (SDEFS[3].cur === 1 && relSpd > 12) {
    // Normal: demo on high-speed impact
    const hitCar = (Math.abs(blue.vx)+Math.abs(blue.vy)) < (Math.abs(orange.vx)+Math.abs(orange.vy)) ? blue : orange;
    demoCar(hitCar);
  }
}

// ─── 7-segment display ────────────────────────────────────────────────────────
const SEGS = {
  0:'abcdef', 1:'bc', 2:'abdeg', 3:'abcdg',
  4:'bcfg',   5:'acdfg', 6:'acdefg', 7:'abc',
  8:'abcdefg', 9:'abcdfg'
};

function drawDigit(x, y, digit, sc, onCol, offCol) {
  const d  = Math.max(0, Math.min(9, digit|0));
  const on = new Set(SEGS[d]);
  const T=Math.ceil(3*sc), Sw=Math.ceil(14*sc), V=Math.ceil(13*sc), G=Math.ceil(1*sc);
  const x2 = T+Sw+G, ym = T+V+G, yb = ym+T+G+V+G;
  const seg = {
    a:[T,0,Sw,T], b:[x2,T,T,V], c:[x2,ym+T+G,T,V],
    d:[T,yb,Sw,T], e:[0,ym+T+G,T,V], f:[0,T,T,V], g:[T,ym,Sw,T]
  };
  for (const [name,[sx,sy,sw,sh]] of Object.entries(seg)) {
    ctx.fillStyle = on.has(name) ? onCol : offCol;
    ctx.fillRect(x+sx, y+sy, sw, sh);
  }
}

// ─── arena ────────────────────────────────────────────────────────────────────
// clip to Scratch-visible portion (SVG x=40-520)
const CLIP_L = Math.round(40  * A_SCALE + ARENA_X);  // ~69
const CLIP_R = Math.round(520 * A_SCALE + ARENA_X);  // ~732

function drawArena() {
  const cx = (WL+WR)/2, cy = (CEIL+FLOOR)/2;
  const ntop = GT_TOP, nbot = GT_BOT, nH = nbot - ntop;
  const netL = WL - CLIP_L, netR = CLIP_R - WR;
  const gw = 5;

  // black side bars
  ctx.fillStyle = '#000';
  ctx.fillRect(0, SB, CLIP_L, H - SB);
  ctx.fillRect(CLIP_R, SB, W - CLIP_R, H - SB);

  // dark atmospheric background
  const bgGrd = ctx.createRadialGradient(cx, cy, 40, cx, cy, 340);
  bgGrd.addColorStop(0, '#0e1530');
  bgGrd.addColorStop(1, '#060810');
  ctx.fillStyle = bgGrd;
  ctx.fillRect(CLIP_L, SB, CLIP_R - CLIP_L, H - SB);

  // arena grid
  ctx.save();
  ctx.beginPath(); ctx.rect(WL, CEIL, WR - WL, FLOOR - CEIL); ctx.clip();
  ctx.strokeStyle = 'rgba(140,180,255,0.07)'; ctx.lineWidth = 1;
  const gridSz = 48;
  for (let gx = WL; gx <= WR + 1; gx += gridSz) {
    ctx.beginPath(); ctx.moveTo(gx, CEIL); ctx.lineTo(gx, FLOOR); ctx.stroke();
  }
  for (let gy = CEIL; gy <= FLOOR + 1; gy += gridSz) {
    ctx.beginPath(); ctx.moveTo(WL, gy); ctx.lineTo(WR, gy); ctx.stroke();
  }
  ctx.restore();

  // ── goal fills + nets ──────────────────────────────────────────────────────
  ctx.save();

  // blue goal fill
  const bgL = ctx.createLinearGradient(CLIP_L, 0, WL, 0);
  bgL.addColorStop(0, 'rgba(30,80,220,0.55)');
  bgL.addColorStop(1, 'rgba(30,80,220,0.04)');
  ctx.fillStyle = bgL;
  ctx.fillRect(CLIP_L, ntop, netL, nH);

  // blue net diagonal cross
  ctx.save();
  ctx.beginPath(); ctx.rect(CLIP_L, ntop, netL, nH); ctx.clip();
  ctx.strokeStyle = 'rgba(80,150,255,0.28)'; ctx.lineWidth = 0.7;
  for (let d = -nH; d <= netL + nH; d += 10) {
    ctx.beginPath(); ctx.moveTo(CLIP_L+d, ntop); ctx.lineTo(CLIP_L+d+nH, nbot); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CLIP_L+d, nbot); ctx.lineTo(CLIP_L+d+nH, ntop); ctx.stroke();
  }
  ctx.restore();

  // orange goal fill
  const bgR = ctx.createLinearGradient(WR, 0, CLIP_R, 0);
  bgR.addColorStop(0, 'rgba(200,80,20,0.04)');
  bgR.addColorStop(1, 'rgba(200,80,20,0.55)');
  ctx.fillStyle = bgR;
  ctx.fillRect(WR, ntop, netR, nH);

  // orange net diagonal cross
  ctx.save();
  ctx.beginPath(); ctx.rect(WR, ntop, netR, nH); ctx.clip();
  ctx.strokeStyle = 'rgba(255,140,60,0.28)'; ctx.lineWidth = 0.7;
  for (let d = -nH; d <= netR + nH; d += 10) {
    ctx.beginPath(); ctx.moveTo(WR+d, ntop); ctx.lineTo(WR+d+nH, nbot); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(WR+d, nbot); ctx.lineTo(WR+d+nH, ntop); ctx.stroke();
  }
  ctx.restore();

  ctx.restore();

  // ── goal frames ────────────────────────────────────────────────────────────
  // blue frame
  ctx.shadowColor = '#4488ff'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#3a6fff';
  ctx.fillRect(CLIP_L,      ntop - gw, netL + gw, gw);      // top bar
  ctx.fillRect(CLIP_L,      nbot,      netL + gw, gw);      // bottom bar
  ctx.fillRect(WL - gw,     ntop - gw, gw, nH + gw*2);      // front post
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#99bbff';
  ctx.fillRect(CLIP_L,      ntop - gw, 3,  nH + gw*2);      // bright back wall

  // orange frame
  ctx.shadowColor = '#ff7733'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#ff6622';
  ctx.fillRect(WR - gw,     ntop - gw, netR + gw, gw);
  ctx.fillRect(WR - gw,     nbot,      netR + gw, gw);
  ctx.fillRect(WR,          ntop - gw, gw, nH + gw*2);
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#ffbb88';
  ctx.fillRect(CLIP_R - 3,  ntop - gw, 3,  nH + gw*2);

  ctx.shadowBlur = 0;

  // ── arena markings (RL Sideswipe side-view style) ─────────────────────────
  ctx.save();
  ctx.beginPath(); ctx.rect(CLIP_L, SB, CLIP_R - CLIP_L, H - SB); ctx.clip();

  // ceiling surface glow
  const clGrd = ctx.createLinearGradient(0, CEIL - 3, 0, CEIL + 5);
  clGrd.addColorStop(0, 'rgba(80,110,200,0)');
  clGrd.addColorStop(0.5, 'rgba(100,150,255,0.50)');
  clGrd.addColorStop(1, 'rgba(60,80,160,0)');
  ctx.fillStyle = clGrd; ctx.fillRect(WL, CEIL - 3, WR - WL, 8);

  // floor surface glow
  const flGrd = ctx.createLinearGradient(0, FLOOR - 12, 0, FLOOR + 8);
  flGrd.addColorStop(0, 'rgba(60,80,200,0.65)');
  flGrd.addColorStop(0.6, 'rgba(80,110,255,0.25)');
  flGrd.addColorStop(1, 'rgba(20,30,70,0)');
  ctx.fillStyle = flGrd; ctx.fillRect(WL, FLOOR - 12, WR - WL, 20);

  // center tick marks on ceiling and floor (RL kickoff indicator)
  ctx.strokeStyle = 'rgba(140,180,255,0.40)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx - 18, CEIL + 1); ctx.lineTo(cx + 18, CEIL + 1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 18, FLOOR - 1); ctx.lineTo(cx + 18, FLOOR - 1); ctx.stroke();

  // subtle vertical center marker (short — only on ceiling and floor area, not full field height)
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = 'rgba(140,180,255,0.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, CEIL + 8); ctx.lineTo(cx, CEIL + 40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, FLOOR - 8); ctx.lineTo(cx, FLOOR - 40); ctx.stroke();
  ctx.setLineDash([]);

  ctx.shadowBlur = 0;
  ctx.restore();
}

// ─── cars ─────────────────────────────────────────────────────────────────────
function drawCarShadow(c) {
  const isBlue = c.team === 'blue';
  const col = isBlue ? 'rgba(60,130,255,' : 'rgba(255,100,30,';

  if (c.ground) {
    // ground glow
    ctx.save();
    ctx.globalAlpha = 0.25;
    const grd = ctx.createRadialGradient(c.x, FLOOR, 0, c.x, FLOOR, CW * 0.85);
    grd.addColorStop(0, col + '0.6)');
    grd.addColorStop(1, col + '0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.ellipse(c.x, FLOOR, CW * 0.85, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    return;
  }
  const heightAbove = FLOOR - c.y;
  const shrink = Math.max(0.1, 1 - heightAbove / 280);
  ctx.save();
  ctx.globalAlpha = 0.22 * shrink;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(c.x, FLOOR + 3, CW * 0.55 * shrink, 4 * shrink, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawCar(c) {
  if (c.demoTimer > 0) {
    // Show respawn countdown ring
    const frac = c.demoTimer / 180;
    const spawnX = c.team === 'blue' ? WL + (WR-WL)*0.18 : WL + (WR-WL)*0.82;
    const col = c.team === 'blue' ? '#4488ff' : '#ff7733';
    ctx.save();
    ctx.globalAlpha = 0.5 * (1 - frac);
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(spawnX, FLOOR - 10, 18 * (1 - frac) + 4, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }
  let a = ((c.angle % 360) + 360) % 360;
  if (a > 180) a -= 360;

  // Barrel roll: car always looks right-side up. Track which side we're on.
  const wasFlipped = c.visualFlipped;
  c.visualFlipped = Math.abs(a) > 130;
  const justFlipped = wasFlipped !== c.visualFlipped;

  let drawAngle, drawFacing;
  if (justFlipped) {
    // Crossed 130° this frame — hold at 130° for one frame so the
    // facing-direction change happens when car is already near-horizontal (less visible).
    drawAngle = Math.sign(a) * 130;
    drawFacing = c.visualFlipped ? -c.facing : c.facing;
  } else if (c.visualFlipped) {
    drawAngle = a > 0 ? 180 - a : -180 - a;
    drawFacing = -c.facing;
  } else {
    drawAngle = a;
    drawFacing = c.facing;
  }

  const isBlue   = c.team === 'blue';
  const carType  = c.team === 'blue' ? bCar : oCar;
  const hw = CW / 2, h = CH;

  const cBody  = isBlue ? '#1e50cc' : '#cc4400';
  const cMid   = isBlue ? '#3a80ff' : '#ff6600';
  const cBrt   = isBlue ? '#88ccff' : '#ffcc66';
  const cDark  = isBlue ? '#0a1840' : '#200800';
  const cWheel = '#252535';
  const cWHub  = '#5566aa';
  const cEng   = isBlue ? '#44aaff' : '#ff6622';

  ctx.save();
  ctx.translate(c.x, c.y);
  if (drawFacing < 0) ctx.scale(-1, 1);
  ctx.rotate(drawAngle * Math.PI / 180);

  // ── boost flame — position varies by car type ────────────────────────────
  if (c.boosting) {
    const fl = 14 + Math.sin(frame * 0.5) * 5;
    const flicker = 0.75 + Math.sin(frame * 1.3) * 0.25;
    const fT = carType===1 ? -h*0.38 : carType===0 ? -h*0.68 : -h*0.94;
    const fM = carType===1 ? -h*0.22 : carType===0 ? -h*0.48 : -h*0.63;
    const fB = carType===1 ? -h*0.08 : carType===0 ? -h*0.26 : -h*0.31;
    ctx.globalAlpha = 0.7 * flicker;
    ctx.fillStyle = cEng;
    ctx.beginPath();
    ctx.moveTo(-hw, fT); ctx.lineTo(-hw - fl*1.2, fM); ctx.lineTo(-hw, fB);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.85 * flicker;
    ctx.beginPath();
    ctx.moveTo(-hw, fT*0.9); ctx.lineTo(-hw - fl*0.5, fM); ctx.lineTo(-hw, fB*0.7);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (c.boosting) { ctx.shadowColor = cBrt; ctx.shadowBlur = 12; }

  if (carType === 0) {
    // ════════════════════════════════════════════════════════════════════════
    // FENNEC — OG Scratch game wedge: rear-peaked, taller than Merc, stubbier
    // Peak sits at the rear-center; long sloping hood to the front.
    // ════════════════════════════════════════════════════════════════════════

    ctx.fillStyle = cDark;
    ctx.fillRect(-hw, -h*0.18, CW, h*0.18);

    const bG0 = ctx.createLinearGradient(0, -h, 0, 0);
    bG0.addColorStop(0, cMid); bG0.addColorStop(0.5, cBody); bG0.addColorStop(1, cDark);
    ctx.fillStyle = bG0;
    ctx.beginPath();
    ctx.moveTo(-hw,      -h*0.92);   // rear tall end
    ctx.lineTo(-hw*0.08, -h);        // peak — rear-center
    ctx.lineTo( hw*0.52, -h*0.68);   // right shoulder
    ctx.lineTo( hw,      -h*0.42);   // front right
    ctx.lineTo( hw,      -h*0.18);   // front bottom
    ctx.lineTo(-hw,      -h*0.18);   // rear bottom
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = cDark;
    ctx.beginPath();
    ctx.moveTo(-hw*0.28, -h*0.92);
    ctx.lineTo(-hw*0.08, -h);
    ctx.lineTo( hw*0.42, -h*0.70);
    ctx.lineTo(-hw*0.02, -h*0.56);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = cBrt; ctx.lineWidth = 1; ctx.stroke();

    ctx.fillStyle = 'rgba(180,220,255,0.15)';
    ctx.beginPath();
    ctx.moveTo(-hw*0.05, -h*0.92); ctx.lineTo(-hw*0.02, -h*0.98);
    ctx.lineTo( hw*0.28, -h*0.80); ctx.lineTo(-hw*0.03, -h*0.65);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = cBrt; ctx.globalAlpha = 0.55;
    ctx.fillRect(-hw, -h*0.92, hw*0.20, h*0.74);
    ctx.globalAlpha = 1;

    ctx.fillStyle = cEng; ctx.shadowColor = cEng;
    ctx.shadowBlur = c.boosting ? 10 : 4;
    ctx.fillRect(-hw, -h*0.72, 4, h*0.48);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff'; ctx.shadowColor = '#aaddff'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(hw-2, -h*0.45, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    for (const wx of [-hw*0.52, hw*0.52]) {
      ctx.fillStyle = cWheel;
      ctx.beginPath(); ctx.arc(wx, -1, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = cWHub;
      ctx.beginPath(); ctx.arc(wx, -1, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.arc(wx-1, -2, 1.2, 0, Math.PI*2); ctx.fill();
    }

  } else if (carType === 1) {
    // ════════════════════════════════════════════════════════════════════════
    // DOMINUS — dramatically flat race car
    // Visual height: 52% of hitbox — still dramatically flat vs Fennec's 73%
    // Shape: short squared rear, long sweeping hood nearly to floor
    // ════════════════════════════════════════════════════════════════════════
    const dh = h * 0.52;

    ctx.fillStyle = cDark;
    ctx.fillRect(-hw, -dh*0.18, CW, dh*0.18);                 // very thin undercarriage

    const bG1 = ctx.createLinearGradient(0, -dh, 0, -dh*0.18);
    bG1.addColorStop(0, cMid); bG1.addColorStop(0.35, cBody); bG1.addColorStop(1, cDark);
    ctx.fillStyle = bG1;
    ctx.beginPath();                                            // flat body: rear cockpit + long nose
    ctx.moveTo(-hw,       -dh*0.18);   // rear bottom
    ctx.lineTo(-hw,       -dh*0.60);   // rear side (short)
    ctx.lineTo(-hw*0.50,  -dh);        // cabin peak — rear 25% of car
    ctx.lineTo( hw*0.08,  -dh);        // cabin front — abrupt drop into hood
    ctx.lineTo( hw*0.48,  -dh*0.50);   // long sweeping hood, mid
    ctx.lineTo( hw,       -dh*0.18);   // very low front nose (~floor level)
    ctx.lineTo( hw,       -dh*0.18);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = cDark;                                      // tiny cockpit roof
    ctx.beginPath();
    ctx.moveTo(-hw*0.50, -dh);
    ctx.lineTo( hw*0.08, -dh);
    ctx.lineTo( hw*0.02, -dh*0.82);
    ctx.lineTo(-hw*0.56, -dh*0.82);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = 'rgba(140,210,255,0.30)';                   // very small angled windshield
    ctx.strokeStyle = cBrt; ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-hw*0.30, -dh*0.80);
    ctx.lineTo( hw*0.00, -dh*0.80);
    ctx.lineTo( hw*0.06, -dh*0.99);
    ctx.lineTo(-hw*0.24, -dh*0.99);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.fillStyle = cEng; ctx.shadowColor = cEng;
    ctx.shadowBlur = c.boosting ? 10 : 4;
    ctx.fillRect(-hw, -dh*0.54, 4, dh*0.34);                  // exhaust
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff'; ctx.shadowColor = '#aaddff'; ctx.shadowBlur = 5;
    ctx.beginPath(); ctx.arc(hw-2, -dh*0.16, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    for (const wx of [-hw*0.52, hw*0.52]) {
      ctx.fillStyle = cWheel;
      ctx.beginPath(); ctx.arc(wx, -1, 5.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = cWHub;
      ctx.beginPath(); ctx.arc(wx, -1, 2.8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.arc(wx-1, -2, 1.2, 0, Math.PI*2); ctx.fill();
    }

  } else {
    // ════════════════════════════════════════════════════════════════════════
    // MERC — upright SUV silhouette, 25% taller visually than hitbox
    // ════════════════════════════════════════════════════════════════════════
    const mh = h * 1.25;  // visual height (hitbox stays at h=CH)

    ctx.fillStyle = cDark;
    ctx.beginPath();
    ctx.moveTo(-hw, -mh*0.14); ctx.lineTo(hw, -mh*0.14);
    ctx.lineTo(hw,  0);        ctx.lineTo(-hw, 0);
    ctx.closePath(); ctx.fill();

    const bG2 = ctx.createLinearGradient(0, -mh, 0, 0);
    bG2.addColorStop(0, cMid); bG2.addColorStop(0.5, cBody); bG2.addColorStop(1, cDark);
    ctx.fillStyle = bG2;
    ctx.beginPath();
    ctx.moveTo(-hw,      -mh*0.88);
    ctx.lineTo( hw*0.3,  -mh);
    ctx.lineTo( hw*0.78, -mh*0.62);
    ctx.lineTo( hw,      -mh*0.38);
    ctx.lineTo( hw,      -mh*0.14);
    ctx.lineTo(-hw,      -mh*0.14);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = cDark;
    ctx.beginPath();
    ctx.moveTo(-hw*0.25, -mh*0.88);
    ctx.lineTo( hw*0.28, -mh);
    ctx.lineTo( hw*0.58, -mh*0.68);
    ctx.lineTo(-hw*0.05, -mh*0.55);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = cBrt; ctx.lineWidth = 1; ctx.stroke();

    ctx.fillStyle = 'rgba(180,220,255,0.10)';
    ctx.beginPath();
    ctx.moveTo(-hw*0.05, -mh*0.88); ctx.lineTo(hw*0.22, -mh*0.97);
    ctx.lineTo( hw*0.30, -mh*0.78); ctx.lineTo(-hw*0.10, -mh*0.72);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = cBrt; ctx.globalAlpha = 0.55;
    ctx.fillRect(-hw, -mh*0.88, hw*0.18, mh*0.74);
    ctx.globalAlpha = 1;

    ctx.fillStyle = cEng; ctx.shadowColor = cEng;
    ctx.shadowBlur = c.boosting ? 10 : 4;
    ctx.fillRect(-hw, -mh*0.72, 4, mh*0.56);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff'; ctx.shadowColor = '#aaddff'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(hw-2, -mh*0.42, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    for (const wx of [-hw*0.52, hw*0.52]) {
      ctx.fillStyle = cWheel;
      ctx.beginPath(); ctx.arc(wx, -1, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = cWHub;
      ctx.beginPath(); ctx.arc(wx, -1, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.arc(wx-1, -2, 1.2, 0, Math.PI*2); ctx.fill();
    }
  }

  ctx.shadowBlur = 0;
  ctx.restore();
}

// ─── ball ─────────────────────────────────────────────────────────────────────
function drawBall() {
  const spin = ball.spin || 0;

  // floor shadow
  const shadowR = Math.max(3, BALL_R * 0.55 * (1 - (FLOOR - ball.y) / 460));
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(ball.x, FLOOR+2, shadowR, 3, 0, 0, Math.PI*2); ctx.fill();

  // outer glow
  const grd = ctx.createRadialGradient(ball.x, ball.y, BALL_R*0.5, ball.x, ball.y, BALL_R*1.6);
  grd.addColorStop(0, 'rgba(120,180,255,0.25)');
  grd.addColorStop(1, 'rgba(60,100,255,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R*1.6, 0, Math.PI*2); ctx.fill();

  // main ball body
  const bg = ctx.createRadialGradient(
    ball.x - BALL_R*0.32, ball.y - BALL_R*0.32, BALL_R*0.05,
    ball.x, ball.y, BALL_R
  );
  bg.addColorStop(0,   '#eef6ff');
  bg.addColorStop(0.4, '#b8d4f0');
  bg.addColorStop(1,   '#7aaad8');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill();

  // rotating seam
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(spin);
  ctx.strokeStyle = 'rgba(30,60,140,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, BALL_R * 0.72, -Math.PI*0.55, Math.PI*0.55);
  ctx.stroke();
  ctx.rotate(Math.PI);
  ctx.beginPath();
  ctx.arc(0, 0, BALL_R * 0.72, -Math.PI*0.55, Math.PI*0.55);
  ctx.stroke();
  ctx.restore();

  // neon edge
  ctx.strokeStyle = 'rgba(140,200,255,0.75)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.stroke();

  // specular highlight
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.ellipse(ball.x - BALL_R*0.28, ball.y - BALL_R*0.32, BALL_R*0.22, BALL_R*0.14, -0.5, 0, Math.PI*2);
  ctx.fill();
}


function drawScore(xRight, y, num, sc, onCol, offCol, leftAlign) {
  const T=Math.ceil(3*sc), Sw=Math.ceil(14*sc), G=Math.ceil(1*sc);
  const dw = T + Sw + G + T + G + 2;
  const n = Math.max(0, Math.min(999, num|0));
  const d = [Math.floor(n/100), Math.floor((n%100)/10), n%10];
  const digits = n>=100 ? 3 : n>=10 ? 2 : 1;
  const totalW = digits * dw;
  let cx = leftAlign ? xRight : xRight - totalW;
  for (let i = 3-digits; i < 3; i++) {
    drawDigit(cx, y, d[i], sc, onCol, offCol);
    cx += dw;
  }
}

function drawScoreboard() {
  ctx.fillStyle = '#070714'; ctx.fillRect(0, 0, W, SB);
  ctx.fillStyle = '#1e1e44'; ctx.fillRect(0, SB-2, W, 2);

  ctx.textAlign = 'left'; ctx.fillStyle = '#4488ff';
  ctx.font = 'bold 15px "Arial Black",Arial';
  ctx.fillText('BLUE', 55, 34);
  ctx.fillStyle = '#4488ff'; ctx.fillRect(53, 39, 52, 3);

  ctx.textAlign = 'right'; ctx.fillStyle = '#ff7733';
  ctx.fillText('ORANGE', W-53, 34);
  ctx.fillStyle = '#ff7733'; ctx.fillRect(W-107, 39, 54, 3);

  ctx.fillStyle = '#555577';
  ctx.fillRect(W/2-4, 14, 5, 5);
  ctx.fillRect(W/2-4, 28, 5, 5);

  drawScore(W/2 - 16, 7, bScore, 1.3, '#4499ff', '#08122a', false);
  drawScore(W/2 + 16, 7, oScore, 1.3, '#ff8833', '#200a00', true);

  // Timer display
  ctx.textAlign = 'center';
  if (gameTimer > 0) {
    const secs = Math.ceil(gameTimer / 60);
    const mm = Math.floor(secs / 60), ss = secs % 60;
    const timeStr = mm + ':' + ss.toString().padStart(2,'0');
    ctx.font = 'bold 13px "Arial Black",Arial';
    ctx.fillStyle = secs <= 10 ? '#ff4444' : '#8888bb';
    ctx.fillText(timeStr, W/2, SB - 6);
  } else if (SDEFS[2].cur === 4 || SDEFS[2].cur === 5) {
    const target = SDEFS[2].cur === 4 ? 3 : 5;
    ctx.font = '10px Arial'; ctx.fillStyle = '#445566';
    ctx.fillText('FIRST TO ' + target, W/2, SB - 6);
  }

  boostBar(53,    SB-12, blue,   '#4488ff');
  boostBar(W-113, SB-12, orange, '#ff7733');
}

function boostBar(x, y, car, col) {
  if (!car) return;
  const bw = 60, bh = 5;
  ctx.fillStyle = '#111122'; ctx.fillRect(x, y, bw, bh);
  const pct = car.boost / BOOST_MAX;
  ctx.fillStyle = pct > 0.6 ? '#ffcc00' : pct > 0.25 ? '#ff8800' : '#ff2200';
  ctx.fillRect(x, y, pct*bw, bh);
  ctx.strokeStyle = '#2a2a55'; ctx.lineWidth = 1; ctx.strokeRect(x, y, bw, bh);
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '8px Arial'; ctx.textAlign = 'left';
  ctx.fillText('BOOST', x, y-2);
}

  ctx.font = 'bold 36px "Arial Black",Arial';
  ctx.fillStyle = '#ffffff'; ctx.fillText('GOAL EXPLOSIONS', W/2, 58);

  ctx.font = '13px Arial'; ctx.fillStyle = '#8888bb';
  ctx.fillText('Choose your celebration — each player picks independently', W/2, 82);

  ctx.font = '12px Arial'; ctx.fillStyle = '#44446a'; ctx.textAlign = 'left';
  ctx.fillText('ESC ← Back', 18, 28);

  const EXPDATA = [
    { name: 'CLASSIC',    desc: 'Colour burst',       col:'#ffcc44', draw: drawExplIconClassic   },
    { name: 'AIR STRIKE', desc: 'Missiles from above', col:'#ff6622', draw: drawExplIconAirStrike },
    { name: 'SHATTER',    desc: 'Crystal fragments',   col:'#88ddff', draw: drawExplIconShatter   },
  ];

  // Two columns: Blue (left, keys 1/2/3) and Orange (right, keys 7/8/9)
  const cols = [
    { label: 'BLUE',   playerCol: '#4488ff', accentBg: '#07091a', keys: ['1','2','3'], sel: bExplosion },
    { label: 'ORANGE', playerCol: '#ff7733', accentBg: '#1a0907', keys: ['7','8','9'], sel: oExplosion },
  ];
  const colX = [30, W/2 + 10];
  const colW  = W/2 - 40;
  const rowH  = 72;
  const startY = 108;

  for (let ci = 0; ci < 2; ci++) {
    const col = cols[ci];
    const cx  = colX[ci];

    // Column header
    ctx.fillStyle = col.playerCol;
    ctx.font = 'bold 14px "Arial Black",Arial'; ctx.textAlign = 'left';
    ctx.fillText(col.label, cx + 4, startY - 4);

    for (let i = 0; i < 3; i++) {
      const e   = EXPDATA[i];
      const ry  = startY + i * rowH;
      const sel = col.sel === i;

      // Row background
      ctx.fillStyle = sel ? col.accentBg : '#0d0d25';
      rrect(cx, ry, colW, rowH - 6, 7); ctx.fill();
      if (sel) { ctx.strokeStyle = col.playerCol; ctx.lineWidth = 2; ctx.stroke(); }

      // Key badge
      ctx.fillStyle = sel ? col.playerCol : col.playerCol + '44';
      ctx.font = 'bold 22px "Arial Black",Arial'; ctx.textAlign = 'center';
      ctx.fillText(col.keys[i], cx + 24, ry + 40);

      // Name + desc
      ctx.fillStyle = sel ? '#ffffff' : '#7788aa';
      ctx.font = 'bold 13px "Arial Black",Arial'; ctx.textAlign = 'left';
      ctx.fillText(e.name, cx + 44, ry + 28);
      ctx.fillStyle = sel ? '#8899cc' : '#334455';
      ctx.font = '11px Arial';
      ctx.fillText(e.desc, cx + 44, ry + 45);

      // Mini icon
      ctx.save();
      ctx.translate(cx + colW - 26, ry + rowH/2 - 3);
      ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI*2);
      ctx.fillStyle = sel ? '#1a1a44' : '#111128'; ctx.fill();
      if (sel) { ctx.strokeStyle = e.col + '55'; ctx.lineWidth = 1; ctx.stroke(); }
      const iconScale = 0.82;
      ctx.scale(iconScale, iconScale);
      e.draw(e.col, sel);
      ctx.restore();
    }
  }

  const pulse = 0.65 + 0.35*Math.sin(frame*0.07);
  ctx.fillStyle = `rgba(26,64,26,${0.7+0.3*pulse})`;
  rrect(W/2-115, H-70, 230, 44, 8); ctx.fill();
  ctx.strokeStyle = `rgba(68,204,68,${pulse})`; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = `rgba(136,255,136,${0.7+0.3*pulse})`;
  ctx.font = 'bold 17px "Arial Black",Arial'; ctx.textAlign = 'center';
  ctx.fillText('ENTER to Play', W/2, H - 40);

  ctx.restore();
}

function drawExplIconClassic(col, sel) {
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
  for (let j = 0; j < 8; j++) {
    const a = j * Math.PI/4 + frame*0.04;
    const d = 11 + 2*Math.sin(frame*0.1 + j);
    ctx.fillStyle = j%2===0 ? col : '#ffffff';
    ctx.globalAlpha = sel ? 0.9 : 0.45;
    ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, 2, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawExplIconAirStrike(col, sel) {
  const t = (frame * 0.07) % 1;
  for (let j = -1; j <= 1; j++) {
    const sy = -18 + t * 36;
    ctx.save();
    ctx.globalAlpha = sel ? (0.8 - Math.abs(sy)/22) : 0.35;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(j*8, sy); ctx.lineTo(j*8-3, sy-8); ctx.lineTo(j*8+3, sy-8);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  if (t > 0.75) {
    ctx.globalAlpha = (1-t)*4 * (sel ? 0.9 : 0.4);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(0, 14, 8*(1-t)*4, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawExplIconShatter(col, sel) {
  const a = frame * 0.03;
  const shards = [[0,-14],[10,-6],[12,8],[4,15],[-4,15],[-12,8],[-10,-6]];
  ctx.strokeStyle = col; ctx.lineWidth = 1;
  ctx.globalAlpha = sel ? 0.8 : 0.35;
  for (let j = 0; j < shards.length; j++) {
    const [sx, sy] = shards[j];
    const r = a + j*0.4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(r)*sx - Math.sin(r)*sy, Math.sin(r)*sx + Math.cos(r)*sy);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI*2); ctx.fill();
}

function drawMenuRow(idx, y, x, sel, col, key) {
  const selected = sel === idx;
  ctx.fillStyle = selected
    ? (col==='#4488ff' ? '#1a3570' : '#5a2000')
    : (col==='#4488ff' ? '#111a35' : '#22100a');
  rrect(x, y-22, 240, 44, 6); ctx.fill();
  if (selected) { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke(); }

  ctx.fillStyle = selected ? col : col+'88';
  ctx.font = 'bold 24px "Arial Black",Arial'; ctx.textAlign = 'center';
  ctx.fillText(key, x+28, y+8);

  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px "Arial Black",Arial';
  ctx.textAlign = 'left'; ctx.fillText(CNAMES[idx], x+52, y+8);

  if (selected) {
    ctx.fillStyle = col; ctx.font = '14px Arial';
    ctx.textAlign = 'right'; ctx.fillText('✓', x+230, y+8);
  }
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

// ─── goal screen ──────────────────────────────────────────────────────────────
function drawGoal() {
  ctx.fillStyle = 'rgba(0,0,0,0.60)'; ctx.fillRect(0, 0, W, H);
  const col = goalTeam === 'blue' ? '#4488ff' : '#ff7733';
  const pulse = 0.85 + 0.15 * Math.sin(frame * 0.18);

  // radial glow behind text
  const grd = ctx.createRadialGradient(W/2, H/2, 10, W/2, H/2, 220);
  grd.addColorStop(0, (goalTeam==='blue'?'rgba(40,100,255,0.35)':'rgba(255,100,30,0.35)'));
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.shadowColor = col;
  ctx.shadowBlur = 30 * pulse;
  ctx.fillStyle = col;
  ctx.font = `bold ${Math.round(72 * pulse)}px "Arial Black",Arial`;
  ctx.fillText('GOAL!', W/2, H/2 - 10);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px Arial';
  ctx.fillText((goalTeam==='blue'?'BLUE':'ORANGE')+' SCORES!', W/2, H/2+36);

  ctx.fillStyle = col; ctx.font = 'bold 22px Arial';
  ctx.fillText(bScore + '  :  ' + oScore, W/2, H/2+72);

  ctx.fillStyle = 'rgba(255,255,255,0.60)'; ctx.font = 'bold 18px Arial';
  ctx.fillText(goalKph + ' KM/H', W/2, H/2+108);
}

// ─── kickoff countdown ────────────────────────────────────────────────────────
function drawKickoff() {
  const num = kickoffTimer > 100 ? '3' : kickoffTimer > 50 ? '2' : '1';
  const frac = ((kickoffTimer - 1) % 50) / 50;  // 1→0 within each second
  const scale = 0.7 + 0.55 * frac;
  const alpha = Math.min(1, frac * 3);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.round(120 * scale)}px "Arial Black",Arial`;
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 40 * frac;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(num, (WL+WR)/2, (CEIL+FLOOR)/2 + 40);
  ctx.restore();
}

// ─── pause overlay ────────────────────────────────────────────────────────────
function drawPause() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,12,0.72)';
  ctx.fillRect(0, 0, W, H);

  const pw = 320, ph = 200, px = W/2 - pw/2, py = H/2 - ph/2;
  ctx.fillStyle = 'rgba(10,10,30,0.96)';
  rrect(px, py, pw, ph, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(120,120,200,0.45)'; ctx.lineWidth = 1.5;
  rrect(px, py, pw, ph, 12); ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 32px "Arial Black",Arial';
  ctx.fillText('PAUSED', W/2, py + 48);

  const opts = [{ label:'CONTINUE', col:['rgba(30,100,30,0.5)','rgba(80,220,80,0.7)','#88ff88'] },
                { label:'BACK TO START', col:['rgba(100,30,30,0.5)','rgba(220,80,80,0.7)','#ff8888'] }];
  opts.forEach((o, i) => {
    const oy = py + 75 + i * 55;
    const sel = pauseSel === i;
    ctx.fillStyle = sel ? o.col[0] : 'rgba(255,255,255,0.04)';
    rrect(W/2-120, oy, 240, 36, 6); ctx.fill();
    if (sel) { ctx.strokeStyle = o.col[1]; ctx.lineWidth = 1.5; rrect(W/2-120, oy, 240, 36, 6); ctx.stroke(); }
    ctx.fillStyle = sel ? o.col[2] : '#666688';
    ctx.font = 'bold 15px "Arial Black",Arial';
    ctx.fillText(o.label, W/2, oy + 23);
  });

  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.font = '11px Arial';
  ctx.fillText('↑ ↓ navigate   Enter confirm   Esc unpause', W/2, py + ph - 12);
  ctx.restore();
  drawHUD();
}

// ─── HUD ──────────────────────────────────────────────────────────────────────
function drawHUD() {
  ctx.save();
  ctx.font = 'bold 12px Arial';
  const py = H - 5;
  const hints = [
    { text: 'A / D  drive    W  jump    Q  boost', align: 'left',  x: 10,   col: '#88bbff' },
    { text: '← →  drive    ↑  jump    Space  boost', align: 'right', x: W-10, col: '#ffaa55' },
  ];
  for (const h of hints) {
    ctx.textAlign = h.align;
    const tw = ctx.measureText(h.text).width;
    const px = h.align === 'left' ? h.x : h.x - tw;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    rrect(px - 6, py - 15, tw + 12, 19, 5); ctx.fill();
    ctx.fillStyle = h.col;
    ctx.fillText(h.text, h.x, py);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
  ctx.fillText('CREATED BY LEVI V', W/2, H-5);
  ctx.restore();
}

// ─── main loop ────────────────────────────────────────────────────────────────
function update() {
  if (state === S.PAUSE) return;
  if (state === S.KICKOFF) {
    kickoffTimer--;
    if (kickoffTimer <= 0) state = S.PLAY;
    return;
  }
  if (state === S.PLAY) {
    updateCar(blue,   'a','d','w','q');
    updateCar(orange, 'ArrowLeft','ArrowRight','ArrowUp',' ');
    updateBall();
    carBallCollide(blue);
    carBallCollide(orange);
    carCarCollide();
    if (shake > 0) shake *= 0.8;

    // Timer countdown (only in Game mode with a time limit)
    if (SDEFS[1].cur === 0 && gameTimer > 0) {
      gameTimer--;
      if (gameTimer <= 0) {
        if (bScore !== oScore) {
          winner = bScore > oScore ? 'blue' : 'orange';
          state = S.WIN;
        } else {
          // Overtime: 60-second sudden death
          gameTimer = 3600;
        }
      }
    }
  }
  if (state === S.GOAL) {
    goalTimer--;
    if (goalTimer <= 150) { spawnObjects(); }
    if (shake > 0) shake *= 0.8;

    if (goalExplosion === 1) {
      // ── Air Strike: staggered missile launches then big detonation ───────
      const fromRight = goalExplX < (WL+WR)/2;
      // 6 missiles, one every ~22 frames starting 5 frames after trigger
      if (goalTimer === 355) { spawnAirStrikeMissile(fromRight, 115); shake = 2; }
      if (goalTimer === 333) { spawnAirStrikeMissile(fromRight,  93); shake = 2; }
      if (goalTimer === 311) { spawnAirStrikeMissile(fromRight,  71); shake = 3; }
      if (goalTimer === 289) { spawnAirStrikeMissile(fromRight,  49); shake = 3; }
      if (goalTimer === 267) { spawnAirStrikeMissile(fromRight,  27); shake = 4; }
      if (goalTimer === 248) { spawnAirStrikeMissile(fromRight,   8); shake = 4; }
      // Pre-impact shockwaves as early missiles arrive
      if (goalTimer === 265) {
        spawnRing(goalExplX, goalExplY, 7, 14, '#ffee44', 4);
        emitParticles(goalExplX, goalExplY, 30, '#ff8800', 10, 5);
        shake = 5;
      }
      if (goalTimer === 251) {
        spawnRing(goalExplX, goalExplY, 9, 14, '#ffee44', 5);
        emitParticles(goalExplX, goalExplY, 40, '#ff9900', 12, 5);
        shake = 6;
      }
      // Main detonation — all missiles converge
      if (goalTimer === 240) {
        const col = goalTeam === 'blue' ? '#4488ff' : '#ff7733';
        // Muted warm-white flash, not cartoon yellow
        flashCol = 'rgba(255,248,235,0.88)'; flashAlpha = 0.88;
        spawnRing(goalExplX, goalExplY, 17, 22, 'rgba(255,248,220,0.95)', 11);
        spawnRing(goalExplX, goalExplY, 10, 30, col+'bb', 7);
        spawnRing(goalExplX, goalExplY,  5, 46, 'rgba(255,255,255,0.55)', 4);
        spawnRing(goalExplX, goalExplY,  3, 68, col+'44', 2);
        // Fire — dark earthy oranges, not cartoon reds/yellows
        const firePal = ['#cc4400','#994400','#773300','#883300','#aa5500','#552200'];
        for (let i = 0; i < 160; i++) {
          const a = Math.random()*Math.PI*2, s = 5 + Math.random()*30;
          particles.push({ x:goalExplX, y:goalExplY,
            vx:Math.cos(a)*s, vy:Math.sin(a)*s - s*0.2,
            life:1, maxLife:50+Math.random()*70, r:3+Math.random()*12,
            col:firePal[Math.floor(Math.random()*firePal.length)] });
        }
        // White-hot center (kept but less prominent)
        for (let i = 0; i < 45; i++) {
          const a = Math.random()*Math.PI*2, s = 10 + Math.random()*22;
          particles.push({ x:goalExplX, y:goalExplY,
            vx:Math.cos(a)*s, vy:Math.sin(a)*s - 6,
            life:1, maxLife:18+Math.random()*18, r:2+Math.random()*7, col:'#ffffff' });
        }
        // Team color embers
        for (let i = 0; i < 50; i++) {
          const a = Math.random()*Math.PI*2, s = 3 + Math.random()*18;
          particles.push({ x:goalExplX, y:goalExplY,
            vx:Math.cos(a)*s, vy:Math.sin(a)*s - 3,
            life:1, maxLife:65+Math.random()*60, r:2+Math.random()*7, col });
        }
        // Charred debris chunks
        for (let i = 0; i < 28; i++) {
          const a = Math.random()*Math.PI*2, s = 4 + Math.random()*17;
          particles.push({ x:goalExplX, y:goalExplY,
            vx:Math.cos(a)*s, vy:Math.sin(a)*s - 5,
            life:1, maxLife:65+Math.random()*45, r:4+Math.random()*9,
            col:['#442200','#331a00','#553300','#221100'][Math.floor(Math.random()*4)],
            shape:'rect', angle:Math.random()*Math.PI*2, angV:(Math.random()-0.5)*0.14 });
        }
        // Heavy smoke — the dominant visual after the flash
        for (let i = 0; i < 32; i++) {
          particles.push({ x: goalExplX + (Math.random()-0.5)*220, y: goalExplY,
            vx:(Math.random()-0.5)*1.2, vy:-3.5 - Math.random()*6,
            life:1, maxLife:140+Math.random()*100, r:18+Math.random()*28,
            col:`rgba(${38+Math.floor(Math.random()*18)},${28+Math.floor(Math.random()*14)},${12+Math.floor(Math.random()*8)},0.52)`, noGrav:true });
        }
        shake = 14;
      }
    }

    // ── Shatter: secondary crystal waves to extend the effect ─────────────
    if (goalExplosion === 2) {
      // Second crystal pulse at ~1.1s
      if (goalTimer === 294) {
        spawnRing(goalExplX, goalExplY, 7, 30, 'rgba(180,170,210,0.75)', 5);
        spawnRing(goalExplX, goalExplY, 4, 48, 'rgba(8,4,18,0.70)', 10);
        for (let i = 0; i < 12; i++) {
          const a = (i/12)*Math.PI*2 + Math.PI/12;
          particles.push({ x:goalExplX, y:goalExplY, vx:Math.cos(a)*9, vy:Math.sin(a)*9,
            life:0.9, maxLife:30+Math.random()*15, r:2.5, lineLen:50, lineHeight:1.8,
            col:'rgba(210,205,235,0.85)', shape:'line', noGrav:true, noFric:true });
        }
        const shardPal2 = ['#c4bcd0','#ffffff','#06030e','#4a2e70','#9880b8'];
        for (let i = 0; i < 25; i++) {
          const a = Math.random()*Math.PI*2, s = 5+Math.random()*14;
          particles.push({ x:goalExplX, y:goalExplY, vx:Math.cos(a)*s, vy:Math.sin(a)*s-3,
            life:0.85, maxLife:100+Math.random()*70, r:2+Math.random()*6,
            col:shardPal2[Math.floor(Math.random()*shardPal2.length)],
            shape:'rect', angle:Math.random()*Math.PI*2, angV:(Math.random()-0.5)*0.16 });
        }
      }
      // Third pulse at ~1.8s — faint, like settling glass
      if (goalTimer === 250) {
        spawnRing(goalExplX, goalExplY, 5, 28, 'rgba(150,140,185,0.55)', 3);
        spawnRing(goalExplX, goalExplY, 3, 45, 'rgba(6,3,14,0.60)', 8);
        for (let i = 0; i < 10; i++) {
          const a = Math.random()*Math.PI*2, s = 4+Math.random()*10;
          particles.push({ x:goalExplX, y:goalExplY, vx:Math.cos(a)*s, vy:Math.sin(a)*s-2,
            life:0.7, maxLife:80+Math.random()*50, r:1.5+Math.random()*5,
            col:['#b0a8c0','#ffffff','#030108'][Math.floor(Math.random()*3)],
            shape:'rect', angle:Math.random()*Math.PI*2, angV:(Math.random()-0.5)*0.12 });
        }
      }
    }
  }
  if (flashAlpha > 0) flashAlpha *= 0.82;
  updateParticles();
}

function render() {
  ctx.clearRect(0, 0, W, H);

  if (!imagesLoaded) {
    ctx.fillStyle = '#07071a'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 120; i++) {
      const sx = (i*173) % W, sy = (i*97) % (H*0.62);
      ctx.fillStyle = `rgba(255,255,255,${0.15+0.15*Math.sin(frame*0.1+i)})`;
      ctx.fillRect(sx, sy, 1, 1);
    }
    ctx.fillStyle = '#888'; ctx.font = '20px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Loading...', W/2, H/2);
    return;
  }

  if (state === S.SETTINGS) { drawSettings(); drawHUD(); return; }
  if (state === S.WIN)      { drawWin(); return; }
  if (state === S.MENU) { drawMenu(); drawHUD(); return; }
  if (state === S.EXPL) { drawExplosionMenu(); drawHUD(); return; }

  // screen shake
  if (shake > 0.5) { ctx.save(); ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); }

  drawArena();
  drawCarShadow(blue);
  drawCarShadow(orange);
  if (state !== S.GOAL) drawBall();
  drawCar(blue);
  drawCar(orange);
  drawScoreboard();
  drawHUD();
  if (state === S.GOAL) drawGoal();
  // Particles always render last so they appear over the goal overlay
  drawParticles();
  if (flashAlpha > 0.01) {
    ctx.globalAlpha = flashAlpha;
    ctx.fillStyle = flashCol;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  if (shake > 0.5) ctx.restore();
  if (state === S.KICKOFF) drawKickoff();
  if (state === S.PAUSE) drawPause();
}

let _lastTime = 0, _accum = 0;
const _STEP = 1000 / 60;
(function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(ts - _lastTime, 100);
  _lastTime = ts;
  _accum += dt;
  while (_accum >= _STEP) {
    frame++;
    update();
    _accum -= _STEP;
  }
  render();
})(0);
</script>
