  <rect x="3" y="13" width="9" height="1" fill="#333333"/>
  <rect x="3" y="14" width="9" height="1" fill="#333333"/>
  <rect x="3" y="15" width="9" height="1" fill="#333333"/>
  <rect x="7" y="9" width="1" height="1" fill="#666666"/>
  <rect x="5" y="10" width="5" height="1" fill="#666666"/>
  <rect x="5" y="11" width="5" height="1" fill="#666666"/>
  <rect x="4" y="12" width="7" height="1" fill="#666666"/>
