  <rect x="26" y="1"  width="1"  height="9" fill="#666666"/>
  <rect x="4"  y="9"  width="23" height="1" fill="#666666"/>

  <!-- Roof rack -->
  <rect x="7"  y="0"  width="3"  height="1" fill="#333333"/>
  <rect x="12" y="0"  width="3"  height="1" fill="#333333"/>
  <rect x="17" y="0"  width="3"  height="1" fill="#333333"/>

  <!-- Rear window -->
  <rect x="6"  y="2"  width="6"  height="7" fill="#56f7ff"/>
  <rect x="6"  y="9"  width="6"  height="1" fill="#666666"/>

  <!-- B-pillar -->
