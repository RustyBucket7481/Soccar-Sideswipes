  <rect x="27" y="11" width="4"  height="1" fill="#000000"/>
  <rect x="27" y="12" width="4"  height="1" fill="#ffffff"/>

  <!-- Front bumper -->
  <rect x="27" y="13" width="5"  height="1" fill="#001fcc"/>
  <rect x="28" y="13" width="3"  height="1" fill="#666666"/>
  <rect x="27" y="14" width="5"  height="1" fill="#000000"/>

