  <rect x="4" y="8" width="7" height="1" fill="#333333"/>
  <rect x="3" y="9" width="9" height="1" fill="#333333"/>
  <rect x="3" y="10" width="9" height="1" fill="#333333"/>
  <rect x="3" y="11" width="9" height="1" fill="#333333"/>
