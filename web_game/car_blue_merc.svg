<svg xmlns="http://www.w3.org/2000/svg" width="34" height="16" viewBox="0 0 34 16" shape-rendering="crispEdges">
  <!-- Body lower section -->
  <rect x="3"  y="8"  width="28" height="5" fill="#003fff"/>
  <rect x="3"  y="13" width="28" height="1" fill="#001fcc"/>
  <rect x="3"  y="14" width="28" height="1" fill="#000000"/>

  <!-- Tall boxy cabin -->
  <rect x="5"  y="1"  width="21" height="8" fill="#003fff"/>

  <!-- Cabin outline -->
  <rect x="5"  y="0"  width="21" height="1" fill="#666666"/>
