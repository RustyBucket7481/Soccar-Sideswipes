  <rect x="5" y="14" width="5" height="1" fill="#666666"/>
  <rect x="7" y="15" width="1" height="1" fill="#666666"/>
  <rect x="27" y="7" width="1" height="1" fill="#333333"/>
  <rect x="24" y="8" width="7" height="1" fill="#333333"/>
  <rect x="23" y="9" width="9" height="1" fill="#333333"/>
  <rect x="23" y="10" width="9" height="1" fill="#333333"/>
